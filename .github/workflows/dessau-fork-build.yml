name: Dessau Fork Build (Windows)
on:
  workflow_dispatch:
    inputs:
      firmar:
        description: "Firmar el .exe (requiere secrets WINDOWS_PFX_*)"
        type: boolean
        default: false
env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Sin binary caching de GHA (evita depender de los tokens ACTIONS_CACHE_*): las libs
  # se compilan desde fuente cada corrida, pero de forma confiable. Se puede reactivar
  # ("clear;x-gha,readwrite") una vez que el build esté verde.
  VCPKG_BINARY_SOURCES: "clear"
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: KyleMayes/install-llvm-action@v2
        with: { version: "15.0.6" }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.75", targets: x86_64-pc-windows-msvc, components: rustfmt }
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.24.5", channel: stable }
      - name: vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg && git checkout ${{ env.VCPKG_COMMIT_ID }}
          ./bootstrap-vcpkg.sh
          VCPKG=$PWD
          echo "VCPKG_ROOT=$VCPKG" >> $GITHUB_ENV
          cd ..
          # Instala las libs nativas del manifest (opus/aom/vpx/yuv/jpeg) en el triplet
          # estático, DONDE los build scripts de los crates las buscan (installed/). Modo
          # manifest: lee vcpkg.json y sus overlay-ports/triplets del root del repo.
          # Sin este install, magnum-opus no encuentra opus/opus_multistream.h y bindgen
          # panica (unwrap sobre Err(())).
          "$VCPKG/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG/installed"
      - shell: bash
        run: pip3 install --upgrade pip && pip3 install requests
      # RustDesk genera src/bridge_generated.rs (gitignored) con flutter_rust_bridge_codegen
      # en un workflow aparte (bridge.yml) y los demas builds bajan el artifact. Como este
      # build es autonomo, lo generamos aca ANTES de cargo build. La version DEBE ser la del
      # crate (=1.80 -> 1.80.1). Sin esto: E0583 "file not found for module bridge_generated".
      - name: flutter_rust_bridge codegen
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          mkdir -p flutter/macos/Runner
          pushd flutter && flutter pub get && popd
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build
        shell: bash
        env: { VCPKG_ROOT: "${{ env.VCPKG_ROOT }}" }
        # SIN --hwcodec/--vram: el codec por hardware (Intel Media SDK) no compila en
        # CI (cl.exe error 2 en mfx_decode.cpp) y no lo necesitamos — RustDesk anda con
        # codec por software y el agente de monitoreo no depende del codec.
        run: python3 ./build.py --portable --flutter --skip-portable-pack
      # La app Flutter NO es un solo .exe: es la carpeta Release (rustdesk.exe + DLLs +
      # data/). Subimos la carpeta COMPLETA; el instalador (Inno) la empaqueta y corre
      # `rustdesk.exe --silent-install` (que instala servicio + autoarranque).
      - uses: actions/upload-artifact@v4
        with:
          name: dessau-rustdesk-windows
          path: flutter/build/windows/x64/runner/Release
          if-no-files-found: error

      # Arma el instalador único Dessau-Setup.exe (Inno) y lo FIRMA si están los secrets
      # del certificado. Desacoplado: con DESSAU_MONITOREO_SECRET solo, arma un instalador
      # SIN firmar (testeable); con CERT_PFX_BASE64 + CERT_PFX_PASSWORD además, lo firma
      # (rustdesk.exe + instalador + desinstalador). Sin DESSAU_MONITOREO_SECRET se salta.
      - name: Instalador Inno (firma si hay cert)
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PFX_PASSWORD: ${{ secrets.CERT_PFX_PASSWORD }}
          DESSAU_MONITOREO_SECRET: ${{ secrets.DESSAU_MONITOREO_SECRET }}
          DESSAU_MONITOREO_URL: ${{ vars.DESSAU_MONITOREO_URL }}
        run: |
          if (-not $env:DESSAU_MONITOREO_SECRET) {
            Write-Host "== Falta DESSAU_MONITOREO_SECRET: no armo el instalador (el artifact de la app queda igual). =="
            exit 0
          }
          choco install innosetup --no-progress -y
          $app = "flutter\build\windows\x64\runner\Release"
          $env:DESSAU_APP_DIR = (Resolve-Path $app).Path
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $isccArgs = @("installer\dessau-monitor.iss")
          $pfx = $null
          if ($env:CERT_PFX_BASE64 -and $env:CERT_PFX_PASSWORD) {
            $pfx = "$env:RUNNER_TEMP\dessau.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
            & $st sign /f $pfx /p $env:CERT_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "$app\rustdesk.exe"
            $sign = "`"$st`" sign /f `"$pfx`" /p `"$env:CERT_PFX_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f"
            $isccArgs = @("/DFirmar", "/Sdessau=$sign") + $isccArgs
            Write-Host "== Instalador con FIRMA (certificado Dessau). =="
          } else {
            Write-Host "== Sin CERT_PFX_BASE64 + CERT_PFX_PASSWORD: instalador SIN firmar (testeable; agrega los dos secrets para firmarlo). =="
          }
          & $iscc @isccArgs
          if ($pfx -and (Test-Path $pfx)) { Remove-Item $pfx -Force }

      - name: Subir el instalador (firmado o no)
        if: ${{ hashFiles('installer/Output/Dessau-Setup.exe') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Dessau-Setup
          path: installer/Output/Dessau-Setup.exe
          if-no-files-found: error
